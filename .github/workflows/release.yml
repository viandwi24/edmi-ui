name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC), no NPM_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # PENDING USER CONFIRMATION (see AGENTS.md section 9): Node is used ONLY for the npm OIDC publish
      # step. Changesets calls `npm publish`, and Trusted Publishing needs Node >= 22.14 and
      # npm >= 11.5.1. Everything else in this repo uses bun.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm i -g npm@latest
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v2.1.2
        id: changesets
        with:
          version-script: bunx changeset version
          # Runs via exec (no shell), so the chained steps live in the root `release` script.
          # gen:strict is rerun by pack:registries per framework with the CDN EDMI_URL.
          publish-script: bun run release
          # One combined GitHub Release per version is created below (the group is fixed), so no
          # per-package releases/tags.
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDMI_URL: https://viandwi24.github.io/edmi-ui
      - name: Build combined release notes
        if: steps.changesets.outputs.published == 'true'
        id: notes
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/tokens/package.json").text()).version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bun run release:notes "$version" "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.notes.outputs.version }}
          name: v${{ steps.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
